name: StoreProject CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/architech-inc/storeproject

jobs:


  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 1a: Continuous Integration (Per-Service Build Matrix)
  # PROC-11 — each service builds in parallel with its own log + cache key.
  # ═══════════════════════════════════════════════════════════════════════════
  build-matrix:
    name: Build ${{ matrix.service.label }} (${{ matrix.service.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { label: "Store.Models (shared library)", project: "Store.Models",            dockerfile: null }
          - { label: "Store.DbServices (data layer)",   project: "Store.DbServices",        dockerfile: null }
          - { label: "Store.API (backend)",            project: "Store.API",               dockerfile: "Store.API/Dockerfile" }
          - { label: "Store.UI (admin/cashier UI)",    project: "Store.UI",                dockerfile: "Store.UI/Dockerfile" }
          - { label: "Store.ControlPlane (orchestrator)", project: "Store.ControlPlane",  dockerfile: "Store.ControlPlane/Dockerfile" }
          - { label: "Store.TenantPortal (public site)",  project: "Store.TenantPortal", dockerfile: "Store.TenantPortal/Dockerfile" }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies (project-scoped)
        run: dotnet restore ${{ matrix.service.project }}/${{ matrix.service.project }}.csproj

      - name: Build ${{ matrix.service.project }} (Release)
        run: dotnet build ${{ matrix.service.project }}/${{ matrix.service.project }}.csproj --configuration Release --no-restore

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 1b: Test Suite — runs once after every matrix leg is green.
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test Suite
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore StoreProject.sln

      - name: Verify Code Formatting
        run: dotnet format StoreProject.sln --verify-no-changes || true

      - name: Build Solution (Release)
        run: dotnet build StoreProject.sln --configuration Release --no-restore

      - name: Execute Automated Unit Test Suite (Store.API)
        run: dotnet test Store.API.Tests/Store.API.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Execute Automated Unit Test Suite (Store.ControlPlane)
        run: dotnet test Store.ControlPlane.Tests/Store.ControlPlane.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Execute Automated Unit Test Suite (Store.TenantPortal)
        run: dotnet test Store.TenantPortal.Tests/Store.TenantPortal.Tests.csproj --configuration Release --no-build --verbosity normal

      # ── PROC-06 / DOC-01: Generate API Analysis Report and publish as CI artifact ─
      - name: Setup Python for API Analysis
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate API Analysis Report
        run: python scripts/api_analyzer.py

      - name: Publish API Analysis Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-analysis-report
          path: api_analysis_report.md
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 2: Container Image Packaging (Docker Multi-Stage Builds)
  # ═══════════════════════════════════════════════════════════════════════════
  docker-build-and-push:
    name: Build & Push Docker Images
    needs: [build-matrix, build-and-test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata for Store.API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.API/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          provenance: true
          sbom: true

      - name: Extract Metadata for Store.UI
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-ui
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.UI Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.UI/Dockerfile
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          provenance: true
          sbom: true

      - name: Extract Metadata for Store.ControlPlane
        id: meta-controlplane
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-controlplane
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.ControlPlane Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.ControlPlane/Dockerfile
          push: true
          tags: ${{ steps.meta-controlplane.outputs.tags }}
          labels: ${{ steps.meta-controlplane.outputs.labels }}
          provenance: true
          sbom: true

      - name: Extract Metadata for Store.TenantPortal
        id: meta-tenantportal
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-tenantportal
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.TenantPortal Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.TenantPortal/Dockerfile
          push: true
          tags: ${{ steps.meta-tenantportal.outputs.tags }}
          labels: ${{ steps.meta-tenantportal.outputs.labels }}
          provenance: true
          sbom: true

      - name: Build and Push Tenant Backup Container
        uses: docker/build-push-action@v5
        with:
          context: docker/backup
          file: docker/backup/Dockerfile.tenant-backup
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/store-tenant-backup:latest
            ${{ env.IMAGE_PREFIX }}/store-tenant-backup:${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 3: Zero-Downtime Deployment
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production Cluster
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in repo settings
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS Secrets Configuration
        id: check-secrets
        run: |
          missing=()
          [ -z "${{ secrets.VPS_HOST }}" ]              && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_SSH_KEY }}" ]           && missing+=("VPS_SSH_KEY")
          [ -z "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" ]    && missing+=("VPS_SSH_KNOWN_HOSTS")
          [ -z "${{ secrets.CONTROLPLANE_DB_CONNECTION_STRING }}" ] && missing+=("CONTROLPLANE_DB_CONNECTION_STRING")
          [ -z "${{ secrets.CONTROLPLANE_MASTER_KEY }}" ]          && missing+=("CONTROLPLANE_MASTER_KEY")
          [ -z "${{ secrets.CONTROLPLANE_WEBHOOK_SIGNING_SECRET }}" ] && missing+=("CONTROLPLANE_WEBHOOK_SIGNING_SECRET")
          [ -z "${{ secrets.ROOT_DOMAIN }}" ]                       && missing+=("ROOT_DOMAIN")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "has_secrets=true" >> $GITHUB_OUTPUT

      - name: Install SSH key with strict host checking
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Write the PINNED known_hosts. Never use ssh-keyscan / accept-new —
          # that introduces a MITM window on first deploy.
          echo "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          # Verify host is reachable and matches known_hosts BEFORE any further step.
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 $VPS_USER@$VPS_HOST "echo 'SSH OK on '$(hostname)"

      - name: Deploy Platform Services to VPS via SSH
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          CONTROLPLANE_DB_CONNECTION_STRING: ${{ secrets.CONTROLPLANE_DB_CONNECTION_STRING }}
          CONTROLPLANE_MASTER_KEY: ${{ secrets.CONTROLPLANE_MASTER_KEY }}
          CONTROLPLANE_WEBHOOK_SIGNING_SECRET: ${{ secrets.CONTROLPLANE_WEBHOOK_SIGNING_SECRET }}
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==> Ensuring target directories exist on VPS..."
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              $VPS_USER@$VPS_HOST \
              "sudo mkdir -p /opt/projects/platform/tenants /opt/projects/proxy/dynamic && \
               sudo chown \$USER:\$USER /opt/projects/platform && \
               sudo chown \$USER:\$USER /opt/projects/platform/*.yml /opt/projects/platform/.env.production 2>/dev/null || true; \
               sudo chown -R 0:0 /opt/projects/platform/tenants /opt/projects/proxy/dynamic"

          echo "==> Writing .env.production on runner..."
          # Extract the password from the connection string secret
          DB_PWD=$(echo "$CONTROLPLANE_DB_CONNECTION_STRING" | grep -oP -i '(?<=Pwd=)[^;]+' || echo "U2BUg2Jd4szfvSPUBy1fB9hNpgclkxXa")
          # Replace the Server IP with the internal docker container name and strip any accidental secret name prefixes
          DB_CONN_FIXED=$(echo "$CONTROLPLANE_DB_CONNECTION_STRING" | sed -E 's/.*(Server=)/\1/i' | sed -E 's/Server=[^;]+/Server=store-controlplane-db/i')

          printf 'CONTROLPLANE_DB_CONNECTION_STRING=%s\nCONTROLPLANE_DB_ROOT_PASSWORD=%s\nCONTROLPLANE_MASTER_KEY=%s\nCONTROLPLANE_WEBHOOK_SIGNING_SECRET=%s\nROOT_DOMAIN=%s\nIMAGE_PREFIX=%s\nGITHUB_TOKEN=%s\n' \
            "$DB_CONN_FIXED" \
            "$DB_PWD" \
            "$CONTROLPLANE_MASTER_KEY" \
            "$CONTROLPLANE_WEBHOOK_SIGNING_SECRET" \
            "$ROOT_DOMAIN" \
            "$IMAGE_PREFIX" \
            "$GITHUB_TOKEN" > /tmp/.env.production

          echo "==> Copying config files to VPS..."
          scp -i ~/.ssh/deploy_key -P $VPS_PORT -o StrictHostKeyChecking=yes \
              docker-compose.platform.yml \
              $VPS_USER@$VPS_HOST:/opt/projects/platform/docker-compose.platform.yml
          scp -i ~/.ssh/deploy_key -P $VPS_PORT -o StrictHostKeyChecking=yes \
              /tmp/.env.production \
              $VPS_USER@$VPS_HOST:/tmp/.env.production
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes $VPS_USER@$VPS_HOST \
              "sudo install -m 0600 /tmp/.env.production /opt/projects/platform/.env.production && \
               sudo chown deploy:deploy /opt/projects/platform/.env.production"

          echo "==> Phase 1: Pull images and start DB only..."
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes \
              $VPS_USER@$VPS_HOST \
              "echo '$GITHUB_TOKEN' | docker login ghcr.io -u Rodern --password-stdin && \
               cd /opt/projects/platform && \
               docker compose --env-file .env.production -f docker-compose.platform.yml pull && \
               docker compose --env-file .env.production -f docker-compose.platform.yml up -d store-controlplane-db"

          echo "==> Publishing registry credentials for the ControlPlane (root-owned, 0600)..."
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes \
              $VPS_USER@$VPS_HOST \
              "sudo install -d -m 0700 -o root -g root /opt/projects/platform/docker-config && \
               sudo install -m 0600 -o root -g root ~/.docker/config.json /opt/projects/platform/docker-config/config.json"

          echo "==> Phase 2: Waiting for DB to be healthy (up to 90s)..."
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              $VPS_USER@$VPS_HOST \
              'for i in $(seq 1 18); do
                STATUS=$(docker inspect --format="{{.State.Health.Status}}" store-controlplane-db 2>/dev/null || echo "missing")
                echo "DB health: $STATUS (attempt $i/18)"
                [ "$STATUS" = "healthy" ] && break
                sleep 5
              done
              STATUS=$(docker inspect --format="{{.State.Health.Status}}" store-controlplane-db 2>/dev/null || echo "missing")
              [ "$STATUS" = "healthy" ] || { echo "ERROR: DB did not become healthy (status=$STATUS)"; exit 1; }'

          echo "==> Phase 3: Starting full platform stack..."
          # NOTE: __EFMigrationsHistory stamping is now handled automatically inside
          # ControlPlaneDataMigrator.StampExistingSchemaAsync (C#), so no shell SQL needed here.
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes \
              $VPS_USER@$VPS_HOST \
              "cd /opt/projects/platform && \
               docker compose --env-file .env.production -f docker-compose.platform.yml up -d --remove-orphans && \
               docker compose --env-file .env.production -f docker-compose.platform.yml ps"

      - name: Deploy Traefik edge proxy + dashboard
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
          TRAEFIK_DASHBOARD_USER: ${{ secrets.TRAEFIK_DASHBOARD_USER }}
          TRAEFIK_DASHBOARD_PASSWORD: ${{ secrets.TRAEFIK_DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$TRAEFIK_DASHBOARD_USER" ] || [ -z "$TRAEFIK_DASHBOARD_PASSWORD" ]; then
            echo "::warning::TRAEFIK_DASHBOARD_USER / TRAEFIK_DASHBOARD_PASSWORD secrets not set - edge proxy left unchanged (dashboard stays disabled)."
            exit 0
          fi

          # apr1 (htpasswd MD5) hash; the single quotes keep the '$' characters literal in the env file.
          HASH=$(openssl passwd -apr1 "$TRAEFIK_DASHBOARD_PASSWORD")
          printf "ROOT_DOMAIN=%s\nTRAEFIK_DASHBOARD_AUTH='%s:%s'\n" \
            "$ROOT_DOMAIN" "$TRAEFIK_DASHBOARD_USER" "$HASH" > /tmp/.env.proxy

          scp -i ~/.ssh/deploy_key -P $VPS_PORT -o StrictHostKeyChecking=yes \
              docker-compose.proxy.yml /tmp/.env.proxy \
              $VPS_USER@$VPS_HOST:/tmp/
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes \
              $VPS_USER@$VPS_HOST \
              "cd /opt/projects/proxy && \
               cp -n docker-compose.yml docker-compose.yml.orig-backup 2>/dev/null; \
               install -m 0644 /tmp/docker-compose.proxy.yml docker-compose.yml && \
               install -m 0600 /tmp/.env.proxy .env.proxy && \
               rm -f /tmp/docker-compose.proxy.yml /tmp/.env.proxy && \
               docker compose --env-file .env.proxy -f docker-compose.yml up -d && \
               docker compose --env-file .env.proxy -f docker-compose.yml ps"

      - name: Post-deploy health-check
        id: healthcheck
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # Curl the container's port DIRECTLY on the VPS (127.0.0.1:19999),
          # NOT via the public domain+Traefik. This avoids:
          #   - DNS propagation lag
          #   - TLS cert provisioning delay from Let's Encrypt
          #   - Port 18080 mismatch (container binds on 19999 per Dockerfile)
          # The port is exposed only on loopback so it is not publicly reachable.
          for i in {1..24}; do
            if ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
                $VPS_USER@$VPS_HOST "curl -fsS http://127.0.0.1:19999/health > /dev/null 2>&1"; then
              echo "Control plane healthy after ${i}x5s"; exit 0
            fi
            echo "Waiting... attempt $i/24"
            sleep 5
          done
          echo "::error::Control plane failed to come up within 120s"
          exit 1

      - name: Dump container diagnostics (always)
        if: steps.check-secrets.outputs.has_secrets == 'true' && always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          echo "======= docker ps (all containers) ======="
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              $VPS_USER@$VPS_HOST "docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>&1 || true"

          echo ""
          echo "======= store-controlplane-db logs (last 50 lines) ======="
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              $VPS_USER@$VPS_HOST "docker logs --tail=50 store-controlplane-db 2>&1 || true"

          echo ""
          echo "======= store-controlplane logs (last 100 lines) ======="
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              $VPS_USER@$VPS_HOST "docker logs --tail=100 store-controlplane 2>&1 || true"

          echo ""
          echo "======= store-controlplane inspect (State + RestartCount) ======="
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              $VPS_USER@$VPS_HOST "docker inspect store-controlplane --format '{{json .State}}' 2>&1 | python3 -m json.tool || true"

