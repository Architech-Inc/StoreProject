name: StoreProject CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/architech-inc/storeproject

jobs:


  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 1a: Continuous Integration (Per-Service Build Matrix)
  # PROC-11 — each service builds in parallel with its own log + cache key.
  # ═══════════════════════════════════════════════════════════════════════════
  build-matrix:
    name: Build ${{ matrix.service.label }} (${{ matrix.service.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { label: "Store.Models (shared library)", project: "Store.Models",            dockerfile: null }
          - { label: "Store.DbServices (data layer)",   project: "Store.DbServices",        dockerfile: null }
          - { label: "Store.API (backend)",            project: "Store.API",               dockerfile: "Store.API/Dockerfile" }
          - { label: "Store.UI (admin/cashier UI)",    project: "Store.UI",                dockerfile: "Store.UI/Dockerfile" }
          - { label: "Store.ControlPlane (orchestrator)", project: "Store.ControlPlane",  dockerfile: "Store.ControlPlane/Dockerfile" }
          - { label: "Store.TenantPortal (public site)",  project: "Store.TenantPortal", dockerfile: "Store.TenantPortal/Dockerfile" }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies (project-scoped)
        run: dotnet restore ${{ matrix.service.project }}/${{ matrix.service.project }}.csproj

      - name: Build ${{ matrix.service.project }} (Release)
        run: dotnet build ${{ matrix.service.project }}/${{ matrix.service.project }}.csproj --configuration Release --no-restore --no-dependencies

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 1b: Test Suite — runs once after every matrix leg is green.
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test Suite
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore StoreProject.sln

      - name: Verify Code Formatting
        run: dotnet format StoreProject.sln --verify-no-changes || true

      - name: Build Solution (Release)
        run: dotnet build StoreProject.sln --configuration Release --no-restore

      - name: Execute Automated Unit Test Suite
        run: dotnet test Store.API.Tests/Store.API.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 2: Container Image Packaging (Docker Multi-Stage Builds)
  # ═══════════════════════════════════════════════════════════════════════════
  docker-build-and-push:
    name: Build & Push Docker Images
    needs: [build-matrix, build-and-test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata for Store.API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.API/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          provenance: true
          sbom: true

      - name: Extract Metadata for Store.UI
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-ui
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.UI Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.UI/Dockerfile
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          provenance: true
          sbom: true

      - name: Extract Metadata for Store.ControlPlane
        id: meta-controlplane
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-controlplane
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.ControlPlane Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.ControlPlane/Dockerfile
          push: true
          tags: ${{ steps.meta-controlplane.outputs.tags }}
          labels: ${{ steps.meta-controlplane.outputs.labels }}
          provenance: true
          sbom: true

      - name: Extract Metadata for Store.TenantPortal
        id: meta-tenantportal
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-tenantportal
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.TenantPortal Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.TenantPortal/Dockerfile
          push: true
          tags: ${{ steps.meta-tenantportal.outputs.tags }}
          labels: ${{ steps.meta-tenantportal.outputs.labels }}
          provenance: true
          sbom: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 3: Zero-Downtime Deployment
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production Cluster
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in repo settings
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS Secrets Configuration
        id: check-secrets
        run: |
          missing=()
          [ -z "${{ secrets.VPS_HOST }}" ]              && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_SSH_KEY }}" ]           && missing+=("VPS_SSH_KEY")
          [ -z "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" ]    && missing+=("VPS_SSH_KNOWN_HOSTS")
          [ -z "${{ secrets.CONTROLPLANE_DB_CONNECTION_STRING }}" ] && missing+=("CONTROLPLANE_DB_CONNECTION_STRING")
          [ -z "${{ secrets.CONTROLPLANE_MASTER_KEY }}" ]          && missing+=("CONTROLPLANE_MASTER_KEY")
          [ -z "${{ secrets.CONTROLPLANE_WEBHOOK_SIGNING_SECRET }}" ] && missing+=("CONTROLPLANE_WEBHOOK_SIGNING_SECRET")
          [ -z "${{ secrets.ROOT_DOMAIN }}" ]                       && missing+=("ROOT_DOMAIN")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "has_secrets=true" >> $GITHUB_OUTPUT

      - name: Install SSH key with strict host checking
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Write the PINNED known_hosts. Never use ssh-keyscan / accept-new —
          # that introduces a MITM window on first deploy.
          echo "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          # Verify host is reachable and matches known_hosts BEFORE any further step.
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 $VPS_USER@$VPS_HOST "echo 'SSH OK on '$(hostname)"

      - name: Deploy Platform Services to VPS via SSH
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          CONTROLPLANE_DB_CONNECTION_STRING: ${{ secrets.CONTROLPLANE_DB_CONNECTION_STRING }}
          CONTROLPLANE_MASTER_KEY: ${{ secrets.CONTROLPLANE_MASTER_KEY }}
          CONTROLPLANE_WEBHOOK_SIGNING_SECRET: ${{ secrets.CONTROLPLANE_WEBHOOK_SIGNING_SECRET }}
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          echo "==> Ensuring target directories exist on VPS..."
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              $VPS_USER@$VPS_HOST \
              "sudo mkdir -p /opt/projects/platform/tenants /opt/projects/proxy/dynamic && sudo chown -R \$USER:\$USER /opt/projects/platform"

          echo "==> Copying docker-compose.platform.yml to VPS..."
          scp -i ~/.ssh/deploy_key -P $VPS_PORT -o StrictHostKeyChecking=yes \
              docker-compose.platform.yml \
              $VPS_USER@$VPS_HOST:/opt/projects/platform/docker-compose.platform.yml

          echo "==> Deploying Control Plane and Tenant Portal..."
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              $VPS_USER@$VPS_HOST "bash -s" << 'EOF'
            set -euo pipefail

            # Materialise secrets as an env file readable only by deploy user.
            sudo install -m 0600 /dev/null /opt/projects/platform/.env.production
            cat <<ENV | sudo tee /opt/projects/platform/.env.production > /dev/null
              CONTROLPLANE_DB_CONNECTION_STRING=${CONTROLPLANE_DB_CONNECTION_STRING}
              CONTROLPLANE_MASTER_KEY=${CONTROLPLANE_MASTER_KEY}
              CONTROLPLANE_WEBHOOK_SIGNING_SECRET=${CONTROLPLANE_WEBHOOK_SIGNING_SECRET}
              ROOT_DOMAIN=${ROOT_DOMAIN}
              IMAGE_PREFIX=${IMAGE_PREFIX}
              GITHUB_TOKEN=${GITHUB_TOKEN}
            ENV
            sudo chown deploy:deploy /opt/projects/platform/.env.production

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/projects/platform
            docker compose --env-file .env.production -f docker-compose.platform.yml pull
            docker compose --env-file .env.production -f docker-compose.platform.yml up -d --remove-orphans
            docker compose --env-file .env.production -f docker-compose.platform.yml ps
          EOF

      - name: Post-deploy health-check
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
        run: |
          for i in {1..12}; do
            if ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
                $VPS_USER@$VPS_HOST "curl -fsS http://cp.${ROOT_DOMAIN}/health > /dev/null"; then
              echo "Control plane healthy after ${i}x5s"; exit 0
            fi
            sleep 5
          done
          echo "::error::Control plane failed to come up within 60s"
          exit 1
