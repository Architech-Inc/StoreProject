name: StoreProject CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 1: Continuous Integration (Lint, Build, Test)
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore StoreProject.sln

      - name: Verify Code Formatting
        run: dotnet format StoreProject.sln --verify-no-changes || true

      - name: Build Solution (Release)
        run: dotnet build StoreProject.sln --configuration Release --no-restore

      - name: Execute Automated Unit Test Suite
        run: dotnet test Store.API.Tests/Store.API.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 2: Container Image Packaging (Docker Multi-Stage Builds)
  # ═══════════════════════════════════════════════════════════════════════════
  docker-build-and-push:
    name: Build & Push Docker Images
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Store.API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.API/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract Metadata for Store.UI
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-ui
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.UI Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.UI/Dockerfile
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}

      - name: Extract Metadata for Store.ControlPlane
        id: meta-controlplane
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-controlplane
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.ControlPlane Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.ControlPlane/Dockerfile
          push: true
          tags: ${{ steps.meta-controlplane.outputs.tags }}
          labels: ${{ steps.meta-controlplane.outputs.labels }}

      - name: Extract Metadata for Store.TenantPortal
        id: meta-tenantportal
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/store-tenantportal
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Store.TenantPortal Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Store.TenantPortal/Dockerfile
          push: true
          tags: ${{ steps.meta-tenantportal.outputs.tags }}
          labels: ${{ steps.meta-tenantportal.outputs.labels }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 3: Zero-Downtime Deployment
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production Cluster
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS Secrets Configuration
        id: check-secrets
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "VPS deployment credentials detected."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning::VPS_HOST or VPS_SSH_KEY secret not found. Skipping automated SSH deployment."
          fi

      - name: Deploy Platform Services to VPS via SSH
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $VPS_PORT -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "==> Ensuring target directories exist on VPS..."
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=accept-new $VPS_USER@$VPS_HOST "sudo mkdir -p /opt/projects/platform/tenants /opt/projects/proxy/dynamic && sudo chown -R \$USER:\$USER /opt/projects/platform"

          echo "==> Copying docker-compose.platform.yml to VPS..."
          scp -i ~/.ssh/deploy_key -P $VPS_PORT -o StrictHostKeyChecking=accept-new docker-compose.platform.yml $VPS_USER@$VPS_HOST:/opt/projects/platform/docker-compose.platform.yml

          echo "==> Deploying Control Plane and Tenant Portal..."
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=accept-new $VPS_USER@$VPS_HOST "bash -s" << 'EOF'
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/projects/platform
            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            docker compose -f docker-compose.platform.yml pull
            docker compose -f docker-compose.platform.yml up -d --remove-orphans
            docker compose -f docker-compose.platform.yml ps
          EOF

