services:
  {{SLUG}}-mongodb:
    image: mongo:7
    container_name: {{SLUG}}-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: {{MONGO_USER}}
      MONGO_INITDB_ROOT_PASSWORD: {{MONGO_PASSWORD}}
    volumes:
      - {{SLUG}}_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - {{SLUG}}_net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  {{SLUG}}-api:
    image: {{STORE_API_IMAGE}}
    container_name: {{SLUG}}-api
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Server={{MYSQL_SERVER}};Port={{MYSQL_PORT}};Database={{MYSQL_DATABASE}};User Id={{MYSQL_USER}};Password={{MYSQL_PASSWORD}};AllowPublicKeyRetrieval=True;
      - MongoDB__ConnectionString=mongodb://{{MONGO_USER}}:{{MONGO_PASSWORD}}@{{SLUG}}-mongodb:27017/?authSource=admin
      - Jwt__Key={{JWT_SECRET}}
      - Auth__OtpPepper={{OTP_PEPPER}}
      - Payments__MoMoCallbackKey={{MOMO_CALLBACK_KEY}}
      - Cors__AllowedOrigins__0=http://{{SLUG}}.{{ROOT_DOMAIN}}:18080
      - Cors__AllowedOrigins__1=https://{{SLUG}}.{{ROOT_DOMAIN}}:18443
      - Seq__ServerUrl=http://store-seq:5341
      - Smtp__Host={{SMTP_HOST}}
      - Smtp__Port={{SMTP_PORT}}
      - Smtp__Username={{SMTP_USERNAME}}
      - Smtp__Password={{SMTP_PASSWORD}}
      - Smtp__FromEmail={{SMTP_FROM_EMAIL}}
      - Smtp__FromName={{SMTP_FROM_NAME}}
      - Smtp__EnableSsl={{SMTP_ENABLE_SSL}}
      - Smtp__IsEnabled={{SMTP_IS_ENABLED}}
    depends_on:
      {{SLUG}}-mongodb:
        condition: service_healthy
    volumes:
      - {{SLUG}}_dataprotection_keys:/root/.aspnet/DataProtection-Keys
      - {{SLUG}}_uploads:/app/Uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - {{SLUG}}_net
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.{{SLUG}}-api.rule=Host(`api.{{SLUG}}.{{ROOT_DOMAIN}}`)"
      - "traefik.http.routers.{{SLUG}}-api.entrypoints=web,websecure"
      - "traefik.http.routers.{{SLUG}}-api.tls=true"
      - "traefik.http.routers.{{SLUG}}-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{SLUG}}-api.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

  {{SLUG}}-ui:
    image: {{STORE_UI_IMAGE}}
    container_name: {{SLUG}}-ui
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiSettings__InternalBaseUrl=http://{{SLUG}}-api:8080
      - ApiSettings__ExternalBaseUrl=http://api.{{SLUG}}.{{ROOT_DOMAIN}}:18080
      - Seq__ServerUrl=http://store-seq:5341
    depends_on:
      {{SLUG}}-api:
        condition: service_healthy
    volumes:
      - {{SLUG}}_dataprotection_keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - {{SLUG}}_net
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.{{SLUG}}-ui.rule=Host(`{{SLUG}}.{{ROOT_DOMAIN}}`)"
      - "traefik.http.routers.{{SLUG}}-ui.entrypoints=web,websecure"
      - "traefik.http.routers.{{SLUG}}-ui.tls=true"
      - "traefik.http.routers.{{SLUG}}-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{SLUG}}-ui.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

  {{SLUG}}-backup:
    image: {{STORE_BACKUP_IMAGE:-clexan-tenant-backup:latest}}
    container_name: {{SLUG}}-backup
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TENANT_SLUG={{SLUG}}
      - MYSQL_HOST={{MYSQL_SERVER}}
      - MYSQL_PORT={{MYSQL_PORT}}
      - MYSQL_USER={{MYSQL_USER}}
      - MYSQL_PASSWORD={{MYSQL_PASSWORD}}
      - MYSQL_DATABASE={{MYSQL_DATABASE}}
      - MONGO_HOST={{SLUG}}-mongodb
      - MONGO_PORT=27017
      - MONGO_USER={{MONGO_USER}}
      - MONGO_PASSWORD={{MONGO_PASSWORD}}
      - MONGO_DATABASE=store_{{SLUG}}
      - BACKUP_ENCRYPTION_KEY={{BACKUP_ENCRYPTION_KEY}}
      - CRON_SCHEDULE={{BACKUP_CRON:-0 2 * * *}}
      - RETENTION_DAYS={{BACKUP_RETENTION_DAYS:-7}}
      - RETENTION_COUNT={{BACKUP_RETENTION_COUNT:-14}}
      - S3_BUCKET={{BACKUP_S3_BUCKET:-}}
      - S3_ENDPOINT={{BACKUP_S3_ENDPOINT:-}}
      - AWS_ACCESS_KEY_ID={{AWS_ACCESS_KEY_ID:-}}
      - AWS_SECRET_ACCESS_KEY={{AWS_SECRET_ACCESS_KEY:-}}
    depends_on:
      {{SLUG}}-mongodb:
        condition: service_healthy
    volumes:
      - {{SLUG}}_backups:/backups
    networks:
      - {{SLUG}}_net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  {{SLUG}}_mongodb_data:
  {{SLUG}}_dataprotection_keys:
  {{SLUG}}_uploads:
  {{SLUG}}_backups:

networks:
  {{SLUG}}_net:
  proxy-network:
    external: true
