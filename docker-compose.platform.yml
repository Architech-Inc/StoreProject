services:
  store-controlplane-db:
    image: mysql:8.0
    container_name: store-controlplane-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${CONTROLPLANE_DB_ROOT_PASSWORD:-U2BUg2Jd4szfvSPUBy1fB9hNpgclkxXa}
      MYSQL_DATABASE: store_controlplane
    volumes:
      - controlplane_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxy-network

  store-controlplane:
    image: ${IMAGE_PREFIX:-ghcr.io/architech-inc/storeproject}/store-controlplane:${IMAGE_TAG:-latest}
    container_name: store-controlplane
    restart: always
    user: "1000:1000"  # non-root; required because we mount the docker socket
    read_only: true
    tmpfs:
      - /tmp:size=64M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Secrets — REQUIRED. docker compose refuses to start if these env vars are unset
      # (the startup guard in SecretEncryptionService throws on missing/placeholder values).
      - ConnectionStrings__ControlPlane=${CONTROLPLANE_DB_CONNECTION_STRING:?CONTROLPLANE_DB_CONNECTION_STRING is required}
      - ControlPlane__MasterEncryptionKey=${CONTROLPLANE_MASTER_KEY:?CONTROLPLANE_MASTER_KEY is required (min 32 chars)}
      - ControlPlane__WebhookSigningSecret=${CONTROLPLANE_WEBHOOK_SIGNING_SECRET:?CONTROLPLANE_WEBHOOK_SIGNING_SECRET is required}
      - ControlPlane__RootDomain=${ROOT_DOMAIN:?ROOT_DOMAIN is required}
      - ControlPlane__HttpPort=18080
      - ControlPlane__HttpsPort=18443
      - ControlPlane__AutoDeployDocker=true
      - ControlPlane__StoreApiImage=${IMAGE_PREFIX:-ghcr.io/architech-inc/storeproject}/store-api:latest
      - ControlPlane__StoreUiImage=${IMAGE_PREFIX:-ghcr.io/architech-inc/storeproject}/store-ui:latest
      - ControlPlaneCors__AllowedOrigins__0=https://portal.${ROOT_DOMAIN}
      - ControlPlaneCors__AllowedOrigins__1=http://portal.${ROOT_DOMAIN}
    volumes:
      # docker socket — proxied via docker-socket-proxy in real production
      # (we keep it here for development; remove or proxy in prod compose).
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/projects/proxy/dynamic:/app/traefik/dynamic
      - /opt/projects/platform/tenants:/app/Tenants
      - controlplane_data:/app/App_Data
    depends_on:
      store-controlplane-db:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.controlplane.rule=Host(`cp.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.controlplane.entrypoints=web,websecure"
      - "traefik.http.services.controlplane.loadbalancer.server.port=19999"

  store-tenantportal:
    image: ${IMAGE_PREFIX:-ghcr.io/architech-inc/storeproject}/store-tenantportal:${IMAGE_TAG:-latest}
    container_name: store-tenantportal
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ControlPlane__BaseUrl=http://store-controlplane:19999
    depends_on:
      store-controlplane:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.tenantportal.rule=Host(`portal.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.tenantportal.entrypoints=web,websecure"
      - "traefik.http.services.tenantportal.loadbalancer.server.port=19090"



  # ─── Watchtower: only if explicitly opted in via env. Off by default. ──────
  watchtower:
    image: containrrr/watchtower
    container_name: store-watchtower
    restart: unless-stopped
    profiles: ["watchtower"]
    command: --schedule "0 0 4 * * *" --cleanup --include-stopped --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy-network

volumes:
  controlplane_data:
  controlplane_db_data:

networks:
  proxy-network:
    external: true
