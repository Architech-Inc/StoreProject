services:
  store-controlplane-db:
    image: mysql:8.0
    container_name: store-controlplane-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${CONTROLPLANE_DB_ROOT_PASSWORD:-U2BUg2Jd4szfvSPUBy1fB9hNpgclkxXa}
      MYSQL_DATABASE: store_controlplane
    volumes:
      - controlplane_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxy-network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  store-controlplane:
    image: ${IMAGE_PREFIX:-ghcr.io/architech-inc/storeproject}/store-controlplane:${IMAGE_TAG:-latest}
    container_name: store-controlplane
    restart: always
    # Removed user mapping so it defaults to root; required to access docker.sock and mapped tenant volumes
    read_only: true
    tmpfs:
      - /tmp:size=64M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # The container binds on 19999 (set in the Dockerfile via ASPNETCORE_HTTP_PORTS).
      # Do NOT use ControlPlane__HttpPort / ControlPlane__HttpsPort here — the app
      # does not read them to change its listen port; only ASPNETCORE_HTTP_PORTS does.
      - ASPNETCORE_HTTP_PORTS=19999
      # Secrets — REQUIRED. docker compose refuses to start if these env vars are unset
      # (the startup guard in SecretEncryptionService throws on missing/placeholder values).
      - ConnectionStrings__ControlPlane=${CONTROLPLANE_DB_CONNECTION_STRING:?CONTROLPLANE_DB_CONNECTION_STRING is required}
      - ControlPlane__MasterEncryptionKey=${CONTROLPLANE_MASTER_KEY:?CONTROLPLANE_MASTER_KEY is required (min 32 chars)}
      - ControlPlane__WebhookSigningSecret=${CONTROLPLANE_WEBHOOK_SIGNING_SECRET:?CONTROLPLANE_WEBHOOK_SIGNING_SECRET is required}
      - ControlPlane__RootDomain=${ROOT_DOMAIN:?ROOT_DOMAIN is required}
      - ControlPlane__AutoDeployDocker=true
      # Host-side path of /app/Tenants (the docker daemon resolves bind mounts on the host).
      - ControlPlane__TenantsHostPath=/opt/projects/platform/tenants
      - ControlPlane__StoreApiImage=${IMAGE_PREFIX:-ghcr.io/architech-inc/storeproject}/store-api:latest
      - ControlPlane__StoreUiImage=${IMAGE_PREFIX:-ghcr.io/architech-inc/storeproject}/store-ui:latest
      - ControlPlane__StoreBackupImage=${IMAGE_PREFIX:-ghcr.io/architech-inc/storeproject}/store-tenant-backup:latest
      - ControlPlaneCors__AllowedOrigins__0=https://portal.${ROOT_DOMAIN}
      - ControlPlaneCors__AllowedOrigins__1=http://portal.${ROOT_DOMAIN}
      - Seq__ServerUrl=${SEQ_SERVER_URL:-http://store-seq:5341}
    ports:
      # Expose on localhost only so the CI health-check can curl it directly
      # via SSH without going through Traefik (avoids TLS cert timing issues).
      - "127.0.0.1:19999:19999"
    volumes:
      # docker socket — proxied via docker-socket-proxy in real production
      # (we keep it here for development; remove or proxy in prod compose).
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/projects/proxy/dynamic:/app/traefik/dynamic
      - /opt/projects/platform/tenants:/app/Tenants
      - controlplane_data:/app/App_Data
      # Registry credentials: root-owned 0600 copy of the deploy user's `docker login ghcr.io`
      # config, refreshed by CI. (The original is owned by the deploy user, which this
      # cap_drop:ALL container's root cannot read.) Lets the docker CLI pull private tenant images.
      - /opt/projects/platform/docker-config/config.json:/root/.docker/config.json:ro
    depends_on:
      store-controlplane-db:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.controlplane.rule=Host(`cp.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.controlplane.entrypoints=web,websecure"
      - "traefik.http.routers.controlplane.tls=true"
      - "traefik.http.routers.controlplane.tls.certresolver=letsencrypt"
      - "traefik.http.services.controlplane.loadbalancer.server.port=19999"
      - "com.centurylinklabs.watchtower.enable=true"

  store-tenantportal:
    image: ${IMAGE_PREFIX:-ghcr.io/architech-inc/storeproject}/store-tenantportal:${IMAGE_TAG:-latest}
    container_name: store-tenantportal
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ControlPlane__BaseUrl=http://store-controlplane:19999
      - Seq__ServerUrl=${SEQ_SERVER_URL:-http://store-seq:5341}
    depends_on:
      store-controlplane:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.tenantportal.rule=Host(`portal.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.tenantportal.entrypoints=web,websecure"
      - "traefik.http.routers.tenantportal.tls=true"
      - "traefik.http.routers.tenantportal.tls.certresolver=letsencrypt"
      - "traefik.http.services.tenantportal.loadbalancer.server.port=19090"
      - "com.centurylinklabs.watchtower.enable=true"

  # ─── Seq: Centralized Log Shipping & Observability (OPS-07) ─────────────────
  store-seq:
    image: datalust/seq:latest
    container_name: store-seq
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=${SEQ_ADMIN_PASSWORD_HASH:-}
    volumes:
      - seq_data:/data
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.seq.rule=Host(`seq.${ROOT_DOMAIN:?ROOT_DOMAIN is required}`)"
      - "traefik.http.routers.seq.entrypoints=web,websecure"
      - "traefik.http.routers.seq.tls=true"
      - "traefik.http.routers.seq.tls.certresolver=letsencrypt"
      - "traefik.http.services.seq.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=false"

  # ─── Watchtower: Automated image updates with cleanup & schedule (OPS-06) ──
  watchtower:
    image: containrrr/watchtower:latest
    container_name: store-watchtower
    restart: unless-stopped
    profiles: ["watchtower"]
    command: --schedule "${WATCHTOWER_SCHEDULE:-0 0 4 * * *}" --cleanup --include-stopped --label-enable
    environment:
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}
      - WATCHTOWER_INCLUDE_STOPPED=${WATCHTOWER_INCLUDE_STOPPED:-true}
      - WATCHTOWER_LABEL_ENABLE=${WATCHTOWER_LABEL_ENABLE:-true}
      - WATCHTOWER_ROLLING_RESTART=${WATCHTOWER_ROLLING_RESTART:-true}
      - WATCHTOWER_TIMEOUT=${WATCHTOWER_TIMEOUT:-60s}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  controlplane_data:
  controlplane_db_data:
  seq_data:

networks:
  proxy-network:
    external: true

