version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik-local
    restart: unless-stopped
    ports:
      - "18080:80"
      - "18443:443"
      - "8080:8080"
    volumes:
      - "./Store.ControlPlane/traefik/dynamic:/etc/traefik/dynamic:ro"
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
