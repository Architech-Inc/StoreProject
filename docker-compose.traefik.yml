# ════════════════════════════════════════════════════════════════════════════════
# Traefik v3 — Edge Proxy with Automated Let's Encrypt TLS (ACME) & Watchtower
#
# Production Hardening:
#   - OPS-03: Dashboard & insecure API gated by TRAEFIK_API_ENABLED (defaults to false)
#   - OPS-05: Automated ACME TLS certificate resolution via Let's Encrypt
#   - OPS-06: Watchtower automated container update orchestrator with cleanup flags
# ─────────────────────────────────────────────────────────────────────────────
# Exposed ports:
#   - HTTP:  ${HTTP_PORT:-80}  -> 80 (production default: 80, local dev: 18080)
#   - HTTPS: ${HTTPS_PORT:-443} -> 443 (production default: 443, local dev: 18443)
#   - Dashboard: ${TRAEFIK_DASHBOARD_PORT:-8080} (only published when TRAEFIK_API_ENABLED=true)
# ════════════════════════════════════════════════════════════════════════════════

version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - "./Store.ControlPlane/traefik/dynamic:/etc/traefik/dynamic:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-acme:/etc/traefik/acme"
    command:
      # API & Dashboard security (OPS-03)
      - "--api.insecure=${TRAEFIK_API_ENABLED:-false}"
      - "--api.dashboard=${TRAEFIK_API_ENABLED:-false}"
      # Dynamic file provider (for tenant routing rules generated by ControlPlane)
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Automated Let's Encrypt TLS ACME Resolver (OPS-05)
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@store.clexan.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      # Dashboard entrypoint (dev only)
      - "--entrypoints.traefik.address=:8080"
    networks:
      - proxy-network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ─── Watchtower: Automated image updates with cleanup & schedule (OPS-06) ──
  watchtower:
    image: containrrr/watchtower:latest
    container_name: store-watchtower-proxy
    restart: unless-stopped
    profiles: ["watchtower"]
    command: --schedule "${WATCHTOWER_SCHEDULE:-0 0 4 * * *}" --cleanup --include-stopped --label-enable
    environment:
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}
      - WATCHTOWER_INCLUDE_STOPPED=${WATCHTOWER_INCLUDE_STOPPED:-true}
      - WATCHTOWER_LABEL_ENABLE=${WATCHTOWER_LABEL_ENABLE:-true}
      - WATCHTOWER_ROLLING_RESTART=${WATCHTOWER_ROLLING_RESTART:-true}
      - WATCHTOWER_TIMEOUT=${WATCHTOWER_TIMEOUT:-60s}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  traefik-acme:

networks:
  proxy-network:
    external: true
